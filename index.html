        account = config['utag']['account'];

      if (enabled) {
        const scriptUrl = `https://tags.tiqcdn.com/utag/${account}/${profileUrl}/${env}/utag.js`;
        const documentRef = document;
        const scriptElement = documentRef.createElement('script');
        scriptElement.src = scriptUrl;
        scriptElement.type = 'text/javascript';
        scriptElement.async = true;
        const firstScript = documentRef.getElementsByTagName('script')[0];
        firstScript.parentNode.insertBefore(scriptElement, firstScript);
