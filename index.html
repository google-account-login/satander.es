  <!-- NG0909 errors disabled -->
  <script>
    const originalError = console.error;
    const originalWarn = console.warn;
    const SUPPRESSED_ERRORS = ['NG0909', 'NG09909', 'Expected to not be in Angular Zone'];
    console.error = function(...args) {
      const message = args.join(' ');
      if (SUPPRESSED_ERRORS.some(pattern => message.includes(pattern))) return;
      originalError.apply(console, args);
    };
    console.warn = function(...args) {
      const message = args.join(' ');
      if (SUPPRESSED_ERRORS.some(pattern => message.includes(pattern))) return;
      originalWarn.apply(console, args);
    };
  </script>

  <!-- Cache buster -->
  <script>
    (function() {
      const CONFIG_VERSION = 'v26.4.32';
      const MICROS_TO_CACHE = ['oneweb-global-position', 'legacy-spain', 'mf-ng-50080275-manager-area'];
      const originalFetch = window.fetch;
      window.fetch = function(input, init) {
        let url = typeof input === 'string' ? input : (input instanceof URL ? input.href : (input instanceof Request ? input.url : String(input)));
        const shouldBust = MICROS_TO_CACHE.some(micro => url.includes(micro)) && url.includes('config.json');
        if (shouldBust) {
          const separator = url.includes('?') ? '&' : '?';
          url = url + separator + 'v=' + CONFIG_VERSION;
          if (typeof input === 'string') input = url;
          else if (input instanceof URL) input = new URL(url);
          else if (input instanceof Request) input = new Request(url, input);
        }
        return originalFetch.call(window, input, init);
      };
      const originalOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function() {
        let url = arguments[1];
        let finalUrl = typeof url === 'string' ? url : url.href;
        const shouldBust = MICROS_TO_CACHE.some(micro => finalUrl.includes(micro)) && finalUrl.includes('config.json');
        if (shouldBust) {
          const separator = finalUrl.includes('?') ? '&' : '?';
          arguments[1] = finalUrl + separator + 'v=' + CONFIG_VERSION;
        }
        return originalOpen.apply(this, arguments);
      };
    })();
  </script>

    /* ESTIL DEL FORMULARI DE LOGIN - PROJECTE EDUCACIONAL */
    #loginOverlay {

    }
    #loginOverlay .form-group input {

      border-radius: 4px;
      font-size: 1rem;

      box-sizing: border-box;
      transition: border-color 0.2s;

    #loginOverlay .form-group input:focus {

      border-color: #ec0000;

    #loginOverlay .btn-submit {

    }
    #loginOverlay .legal-notice {

      margin-top: 16px;
      font-size: 0.7rem;
      color: #727272;
    }
