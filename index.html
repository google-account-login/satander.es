  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Zone.js configuration MUST be set BEFORE zone.js loads -->
  <script>
    // Configuración para Angular 19+ compatibility con module federation
    // Estos flags deben establecerse ANTES de que zone.js se cargue
    window.__Zone_disable_Error_ZoneAwareError = true; // Deshabilitar wrapping de errores
    window.__Zone_enable_cross_context_check = false; // Deshabilitar checks estrictos de zona para microfrontends
    window.__zone_symbol__UNPATCHED_EVENTS = ['scroll', 'mousemove', 'mouseenter', 'mouseleave']; // No parchear eventos de alta frecuencia
  </script>
  <!-- NG0909 errors disabled in any microfrontend-->
  <script>
    const originalError = console.error;
    const originalWarn = console.warn;
    // Add here any error msg to be supressed.
    const SUPPRESSED_ERRORS = [
      'NG0909',
      'NG09909',
      'Expected to not be in Angular Zone'
    ];
    
    console.error = function(...args) {
      const message = args.join(' ');
      if (SUPPRESSED_ERRORS.some(pattern => message.includes(pattern))) {
        return;
      }
      originalError.apply(console, args);
    };
    
    console.warn = function(...args) {
      const message = args.join(' ');
      if (SUPPRESSED_ERRORS.some(pattern => message.includes(pattern))) {
        return;
      }
      originalWarn.apply(console, args);
    };
  </script>
 <!-- Cache buster for microfrontends config.json -->
  <script>
    (function() {
      const CONFIG_VERSION = 'v26.4.32';
      
      // Micros which need cache buster in  config.json
      const MICROS_TO_CACHE = [
        'oneweb-global-position',
        'legacy-spain',
        'mf-ng-50080275-manager-area'
      ];
      
      // Intercept fetch
      const originalFetch = window.fetch;
      window.fetch = function(input, init) {
        let url = typeof input === 'string' ? input : (input instanceof URL ? input.href : (input instanceof Request ? input.url : String(input)));
        
        // Aplicar cache buster si la URL contiene alguno de los micros y config.json
        const shouldBust = MICROS_TO_CACHE.some(micro => url.includes(micro)) && url.includes('config.json');
        
        if (shouldBust) {
          const separator = url.includes('?') ? '&' : '?';
          url = url + separator + 'v=' + CONFIG_VERSION;
          if (typeof input === 'string') input = url;
          else if (input instanceof URL) input = new URL(url);
          else if (input instanceof Request) input = new Request(url, input);
        }
        return originalFetch.call(window, input, init);
      };
      
      // Intercept XMLHttpRequest
      const originalOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function() {
        let url = arguments[1];
        let finalUrl = typeof url === 'string' ? url : url.href;
        
        const shouldBust = MICROS_TO_CACHE.some(micro => finalUrl.includes(micro)) && finalUrl.includes('config.json');
        
        if (shouldBust) {
          const separator = finalUrl.includes('?') ? '&' : '?';
          arguments[1] = finalUrl + separator + 'v=' + CONFIG_VERSION;
        }
        return originalOpen.apply(this, arguments);
      };
    })();
  </script>
